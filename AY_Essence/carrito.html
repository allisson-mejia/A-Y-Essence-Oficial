<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi carrito | A&Y Essence</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>


<header class="header">

    <a href="index.html"
       class="logo">

        <img
            src="img/logo.png"
            alt="A&Y Essence">

    </a>


    <nav class="nav">

        <a href="index.html">
            Inicio
        </a>

        <a href="productos.html">
            Productos
        </a>

        <a href="nosotros.html">
            Sobre nosotros
        </a>

        <a href="contacto.html">
            Contáctanos
        </a>

    </nav>

</header>


<main class="carrito-pagina">

    <h1>
        Mi carrito
    </h1>


    <div id="carrito-container"
         class="carrito-container">

        <p class="carrito-vacio">
            Tu carrito está vacío.
        </p>

    </div>


    <aside class="resumen-carrito">

        <h2>
            Resumen del pedido
        </h2>


        <div class="resumen-linea">

            <span>
                Subtotal
            </span>

            <span id="subtotal">
                C$ 0
            </span>

        </div>


        <div class="resumen-linea">

            <span>
                Envío
            </span>

            <span>
                C$ 0
            </span>

        </div>


        <hr>


        <div class="resumen-total">

            <strong>
                Total
            </strong>

            <strong id="total">
                C$ 0
            </strong>

        </div>


        <button
            class="boton"
            id="finalizar-compra">

            Finalizar compra

        </button>


        <a
            href="productos.html"
            class="seguir-comprando">

            Seguir comprando

        </a>

    </aside>

</main>


<script src="js/script.js"></script>

</body>

</html>
