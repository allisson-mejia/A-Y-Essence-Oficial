<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Buscar | A&Y Essence</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>


<header class="header">

    <a href="index.html"
       class="logo">

        <img
            src="img/logo.png"
            alt="A&Y Essence">

    </a>

</header>


<main class="busqueda">

    <h1>
        Buscar
    </h1>


    <div class="barra-busqueda">

        <input
            type="search"
            id="campo-busqueda"
            placeholder="Escribe el nombre del perfume...">

        <button
            id="boton-buscar">

            🔍 Buscar

        </button>

    </div>


    <div class="busquedas-populares">

        <h2>
            Búsquedas populares
        </h2>

        <button class="busqueda-tag">
            Florales
        </button>

        <button class="busqueda-tag">
            Dulces
        </button>

        <button class="busqueda-tag">
            Frescos
        </button>

        <button class="busqueda-tag">
            Intensos
        </button>

    </div>


    <div id="resultados-busqueda"
         class="resultados-busqueda">

    </div>

</main>


<script src="js/script.js"></script>

</body>

</html>
